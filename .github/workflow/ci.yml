# .github/workflows/ci.yml

name: CI de Base - Qualité du Code (3 Jobs)

on:
  pull_request:
    branches:
      - develop

jobs:
  # 1. JOB DE PRÉPARATION (SETUP)
  setup:
    name: 1. Setup Stack (Python)
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: 📦 Configuration du cache & Installation des dépendances
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: ⚙️ Installation des dépendances (reqs, pre-commit, mypy)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pre-commit mypy


  # 2. JOB DE LINTING (LINT)
  lint:
    name: 2. Linting & Formatage (Flake8 & Black)
    runs-on: ubuntu-latest
    needs: setup # Dépend du succès du job 'setup'
    
    steps:
    # Récupérer les artifacts ou utiliser le même environnement. 
    # Le plus simple et rapide est de refaire un setup minimal.
    # Pour un gain de temps, on assume que les outils ont été installés/mis en cache.
    # Si les outils ne sont pas dans le PATH global (ce qui est le cas ici), on doit refaire le setup.
    - name: ⬇️ Checkout du code (nécessaire pour exécuter les outils)
      uses: actions/checkout@v4
    
    # On ne réinstalle pas les packages, on exécute l'outil
    - name: 🐍 Setup Python 3.13 (pour accéder aux outils)
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: 🔍 Exécution du Linting & Formatage
      run: |
        pip install pre-commit # Re-installation rapide
        pre-commit run --all-files


  # 3. JOB DE VÉRIFICATION DES TYPES (TYPE-CHECK)
  type_check:
    name: 3. Type Check (mypy)
    runs-on: ubuntu-latest
    needs: setup # Dépend du succès du job 'setup'
    
    steps:
    - name: ⬇️ Checkout du code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python 3.13 (pour accéder aux outils)
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: 🩺 Exécution du Type Check
      run: |
        pip install mypy # Re-installation rapide
        mypy .