# .github/workflows/llm-review.yml

name: Revue de Code par LLM & Notification

# Se déclenche sur l'ouverture ou la mise à jour (synchronize) d'une PR vers develop
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

permissions:
  pull-requests: write # Permet au bot de commenter la PR
  contents: read

jobs:
  review_and_notify:
    name: Revue IA et Email
    runs-on: ubuntu-latest
    
    steps:
    
    # 1. Checkout du code
    - name: ⬇️ 1. Checkout du code
      uses: actions/checkout@v4
      
    # 2. Obtenir le Diff (Changements) de la PR
    - name: 📝 2. Obtenir le diff de la PR
      id: get_diff
      run: |
        # Télécharger le diff de la PR
        DIFF=$(curl -s ${{ github.event.pull_request.diff_url }})
        # Stocker dans une variable d'environnement multiligne
        echo "DIFF_CONTENT<<EOF" >> $GITHUB_ENV
        echo "$DIFF" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
    # 3. Appel au LLM (DeepSeek via OpenRouter)
    - name: 🧠 3. Appel au LLM (DeepSeek via OpenRouter)
      id: call_llm
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        DIFF: ${{ env.DIFF_CONTENT }}
      run: |
        set -e
        # Prompt enrichi pour demander une source via un lien
        PROMPT="Tu es un relecteur de code expert. Analyse le diff pour des bugs ou des améliorations. Réponds en français. Dans ta réponse finale, inclue un lien vers une ressource externe (article, video youtube ou documentation) pertinente pour corriger le problème le plus important ou pour améliorer le code. La réponse doit être formatée en Markdown. Voici le DIFF:\n\n---\n$DIFF\n---\n"
        
        # Appel API CURL à OpenRouter pour DeepSeek
        API_RESPONSE=$(curl -s -w "%{http_code}" -X POST "https://openrouter.ai/api/v1/chat/completions" \
          -H "Authorization: Bearer $OPENROUTER_API_KEY" \
          -H "Content-Type: application/json" \
          -H "HTTP-Referer: ${{ github.server_url }}/${{ github.repository }}" \
          -d "{
              \"model\": \"deepseek/deepseek-r1-0528:free\",
              \"messages\": [{\"role\": \"user\", \"content\": \"$PROMPT\"}]
            }")
        
        HTTP_CODE=${API_RESPONSE: -3}
        RESPONSE_BODY=${API_RESPONSE%???}
        
        if [ "$HTTP_CODE" -ne 200 ]; then
          echo "API call failed with HTTP code: $HTTP_CODE"
          echo "Response: $RESPONSE_BODY"
          exit 1
        fi
        
        LLM_RESPONSE=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content')
        
        if [ "$LLM_RESPONSE" = "null" ] || [ -z "$LLM_RESPONSE" ]; then
          echo "Failed to extract LLM response"
          exit 1
        fi
        
        # Stocker la réponse pour les étapes 4 et 5
        echo "LLM_RESPONSE=$LLM_RESPONSE" >> $GITHUB_ENV

    # 4. Commenter sur la PR (Confirmation : OUI, cette étape poste le commentaire)
    - name: 💬 4. Poster le commentaire de la revue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          try {
            const response = `${{ env.LLM_RESPONSE }}`;
            const actor = `${{ github.actor }}`;
            const prLink = `${{ github.event.pull_request.html_url }}`;
            const body = `## 🤖 Revue Automatisée par l'IA (DeepSeek)\n\nSalut @${actor},\n\nVoici l'analyse de code pour ta PR :\n\n---\n${response}\n---\n\n_Veuillez noter que le commentaire complet et l'email ont été envoyés à l'équipe._`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          } catch (error) {
            core.setFailed(`Failed to create comment: ${error.message}`);
          }
          
    # 5. Envoyer l'Email de notification (Inclut le nom de l'auteur)
    - name: 📧 5. Envoyer l'email de notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        
        # Ajout du nom de l'auteur dans le sujet
        subject: "🚨 Revue LLM pour PR #${{ github.event.pull_request.number}} par ${{ github.event.pull_request.user.login }}"
        
        # Ajout du nom de l'auteur et lien dans le corps
        body: |
          Bonjour l'équipe,
          
          Une nouvelle Pull Request (#${{ github.event.pull_request.number}}) a été soumise par **@${{ github.event.pull_request.user.login }}**.
          
          Voici la revue générée par l'IA (DeepSeek) :
          
          ---
          
          ${{ env.LLM_RESPONSE }}
          
          ---
          
          Lien vers la PR : ${{ github.event.pull_request.html_url }}
          
        to: ${{ secrets.TEAM_EMAIL_LIST }}
        from: ${{ secrets.MAIL_USERNAME }}
    

